      <p>
        Morphiq (Astral Morphiq Systems) es un estudio de soluciones digitales para negocios en
        la Ciudad de México. Diseño lo que tus clientes ven y construyo lo que tu negocio
        necesita.
      </p>

      <ul>
        <li><strong>Diseño y desarrollo web.</strong> Sitios que se sienten propios, no rentados.</li>
        <li><strong>Punto de venta.</strong> La caja, el inventario y los pedidos hablando entre sí.</li>
        <li><strong>CRM y datos.</strong> Cada prospecto, documento y decisión en el mismo mapa.</li>
        <li><strong>Automatizaciones.</strong> Menos pendientes persiguiéndote, más trabajo sucediendo solo.</li>
        <li><strong>Software a la medida.</strong> Si no existe la herramienta que necesitas, la construyo.</li>
