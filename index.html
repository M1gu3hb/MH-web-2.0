    <!-- Indexable y rastreable sin restricciones. `max-image-preview:large`
         permite que Google use la imagen grande en resultados y Discover;
         los otros dos quitan el recorte del fragmento de texto. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Morphiq no es una agencia web: la propuesta es digitalizar la operación
         completa de un negocio, y eso es justo lo que dice el title. La
         description baja al detalle con los cinco frentes. Que el desarrollo
         web sea la puerta de entrada comercial es una decisión de venta, no lo
         que este sitio le declara a Google. -->
    <title>Morphiq | Digitalizamos la operación de tu negocio en CDMX</title>
    <meta
      name="description"
      content="Diseño y construyo páginas web, puntos de venta, CRM y automatizaciones para negocios de la Ciudad de México. Páginas desde $2,000 MXN, con precio cerrado antes de empezar."
    />
    <meta name="author" content="Miguel Huerta Bautista" />
    <link rel="canonical" href="https://www.morphiq.com.mx/" />

    <!-- El lockup de la pantalla de carga es lo primero que se ve: pedido aquí
         empieza a bajar con el HTML, en paralelo con el JS, en vez de esperar a
         que React monte. Es la diferencia entre entrar viendo la marca y entrar
         viendo una pantalla vacía con la barra corriendo. -->
    <link rel="preload" as="image" href="/marca/lockup-apilado.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/marca/lockup-horizontal.webp" type="image/webp" />

    <!-- Los dos iconos anteriores no eran cuadrados (192x171 y 512x457) y
         Google descarta el favicon que no es 1:1. Estos salen del símbolo 3D
         del hero, recortado a su contenido y centrado en un lienzo cuadrado,
         sin el wordmark y con el fondo transparente. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ============================================================

         entiende que la organización, la página y los servicios son la misma
         entidad y no cinco cosas que coinciden de nombre.

         Todo lo que va aquí sale de la propia página. No hay valoraciones
         inventadas, ni precios que no publico, ni horarios que no tengo.

         Sobre el nombre: `name` es Morphiq, que es la marca pública y lo que
         se ve en el sitio, y `alternateName` es Astral Morphiq Systems, el
         nombre completo. Así van en Organization y en WebSite, y og:site_name
         dice lo mismo, para que las tres señales no se contradigan y buscar
         cualquiera de los dos nombres lleve a la misma entidad. -->

    <!-- El sitio es una aplicación de React: hasta que no se ejecuta el JS, el
         HTML no tiene ni un titular ni un enlace. Google sabe ejecutarlo y lo
         hace bien —está medido—, pero no todos los rastreadores renderizan, y
         si el render falla o se retrasa lo único que queda por leer es una
         página vacía. Esto es esa red de seguridad: el mismo mensaje y los
         mismos enlaces de la página, en texto plano. No se ve nunca mientras
         haya JavaScript, así que no cambia nada de lo que ve una persona. -->
